<line x1="920" y1="140" x2="941" y2="140" stroke="#CBD5E1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="700" y="206" width="264" height="46" rx="6" fill="#FEF3C7" stroke="#FDE68A"/>
<text x="712" y="224" font-size="10.5" fill="#92400E" font-weight="650" text-anchor="start">A fabricated employer is worse than a blank.</text>
<text x="712" y="239" font-size="10" fill="#92400E" font-weight="400" text-anchor="start">Unprovable ⇒ refused, counted, and shown as such.</text>
<text x="24" y="276" font-size="10" fill="#64748B" font-weight="700" text-anchor="start">ARTEFACTS &amp; STORAGE</text>
<rect x="24" y="282" width="200" height="84" rx="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="35" y="302" font-size="12.5" font-weight="650" fill="#0F172A">JSON / CSV exports</text>
<text x="35" y="319.0" font-size="10" fill="#64748B">candidates · employment</text>
<text x="35" y="332.5" font-size="10" fill="#64748B">education · skills · evidence</text>
<text x="35" y="346.0" font-size="10" fill="#64748B">*_status columns:</text>
<text x="35" y="359.5" font-size="10" fill="#64748B">abstained ≠ missing</text>
<rect x="248" y="282" width="200" height="84" rx="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="259" y="302" font-size="12.5" font-weight="650" fill="#0F172A">SQLite + FTS5</text>
<text x="259" y="319.0" font-size="10" fill="#64748B">metadata + labels</text>
<text x="259" y="332.5" font-size="10" fill="#64748B">review audit log</text>
<text x="259" y="346.0" font-size="10" fill="#64748B">GDPR erasure, end to end</text>
<text x="259" y="359.5" font-size="10" fill="#64748B">(tested)</text>
<rect x="472" y="282" width="224" height="84" rx="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="483" y="302" font-size="12.5" font-weight="650" fill="#0F172A">FAISS IndexFlatIP</text>
<text x="483" y="319.0" font-size="10" fill="#64748B">bge-small ONNX, 384-d</text>
<text x="483" y="332.5" font-size="10" fill="#64748B">exact search (not ANN)</text>
<text x="483" y="346.0" font-size="10" fill="#64748B">section-aware chunks</text>
<text x="483" y="359.5" font-size="10" fill="#64748B">manifest refuses stale index</text>
<rect x="720" y="282" width="244" height="84" rx="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="731" y="302" font-size="12.5" font-weight="650" fill="#0F172A">Run manifest</text>
<text x="731" y="319.0" font-size="10" fill="#64748B">model · versions · git SHA</text>
<text x="731" y="332.5" font-size="10" fill="#64748B">tokens · cost · timings</text>
<text x="731" y="346.0" font-size="10" fill="#64748B">every artefact traceable</text>
<line x1="600" y1="198" x2="600" y2="278" stroke="#CBD5E1" stroke-width="1.6" marker-end="url(#a)"/>
<text x="24" y="398" font-size="10" fill="#64748B" font-weight="700" text-anchor="start">SERVING</text>
<rect x="24" y="404" width="300" height="96" rx="7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.4"/>
<text x="35" y="424" font-size="12.5" font-weight="650" fill="#0F172A">6 · Search  (5 subagents)</text>
<text x="35" y="441.0" font-size="10" fill="#64748B">NL query → filters + exclusions</text>
<text x="35" y="454.5" font-size="10" fill="#64748B">dense (bge) ⊕ lexical (BM25)</text>
<text x="35" y="468.0" font-size="10" fill="#64748B">RRF fusion, k=60 — rank-based,</text>
<text x="35" y="481.5" font-size="10" fill="#64748B">so no score calibration needed</text>
<rect x="348" y="404" width="300" height="96" rx="7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.4"/>
<text x="359" y="424" font-size="12.5" font-weight="650" fill="#0F172A">7 · Matching  (5 subagents)</text>
<text x="359" y="441.0" font-size="10" fill="#64748B">must-haves gate before scoring</text>
<text x="359" y="454.5" font-size="10" fill="#64748B">excluded shown, never dropped</text>
<text x="359" y="468.0" font-size="10" fill="#64748B">score = Σ weight × component</text>
<text x="359" y="481.5" font-size="10" fill="#64748B">counterfactual: minimal edit</text>
<rect x="672" y="404" width="292" height="96" rx="7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.4"/>
<text x="683" y="424" font-size="12.5" font-weight="650" fill="#0F172A">8 · Insight  (4 subagents)</text>
<text x="683" y="441.0" font-size="10" fill="#64748B">distributions · co-occurrence</text>
<text x="683" y="454.5" font-size="10" fill="#64748B">COVERAGE GAPS —</text>
<text x="683" y="468.0" font-size="10" fill="#64748B">which reqs you cannot fill</text>
<text x="683" y="481.5" font-size="10" fill="#64748B">data-quality dashboard</text>
<line x1="174" y1="370" x2="174" y2="400" stroke="#CBD5E1" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="498" y1="370" x2="498" y2="400" stroke="#CBD5E1" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="818" y1="370" x2="818" y2="400" stroke="#CBD5E1" stroke-width="1.6" marker-end="url(#a)"/>
<text x="24" y="522" font-size="10" fill="#64748B" font-weight="700" text-anchor="start">STREAMLIT WORKSPACE</text>
<rect x="24" y="528" width="106" height="34" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
<text x="77" y="550" font-size="11" fill="#0F172A" font-weight="600" text-anchor="middle">Search</text>
<rect x="142" y="528" width="106" height="34" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
<text x="195" y="550" font-size="11" fill="#0F172A" font-weight="600" text-anchor="middle">Candidate</text>
<rect x="260" y="528" width="106" height="34" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
<text x="313" y="550" font-size="11" fill="#0F172A" font-weight="600" text-anchor="middle">Requisition</text>
<rect x="378" y="528" width="106" height="34" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
<text x="431" y="550" font-size="11" fill="#0F172A" font-weight="600" text-anchor="middle">Shortlist</text>
<rect x="496" y="528" width="106" height="34" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
<text x="549" y="550" font-size="11" fill="#0F172A" font-weight="600" text-anchor="middle">Intake</text>
<rect x="614" y="528" width="106" height="34" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
<text x="667" y="550" font-size="11" fill="#0F172A" font-weight="600" text-anchor="middle">Review</text>
<rect x="732" y="528" width="106" height="34" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
<text x="785" y="550" font-size="11" fill="#0F172A" font-weight="600" text-anchor="middle">Analytics</text>
<rect x="850" y="528" width="106" height="34" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.3"/>
<text x="903" y="550" font-size="11" fill="#0F172A" font-weight="600" text-anchor="middle">System</text>
<line x1="498" y1="504" x2="498" y2="524" stroke="#CBD5E1" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="24" y="596" width="940" height="60" rx="7" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.4"/>
<text x="38" y="618" font-size="12" fill="#065F46" font-weight="700" text-anchor="start">FAIRNESS FIREWALL — structural, not statistical</text>
<text x="38" y="636" font-size="10.5" fill="#065F46" font-weight="400" text-anchor="start">SensitiveAttributes (name · email · phone · address · marital status · nationality · interests)  ⟶  NEVER reaches the scorer.</text>
<text x="38" y="649" font-size="10.5" fill="#065F46" font-weight="400" text-anchor="start">score_candidate() accepts only ScorableProfile, which has no field capable of carrying a protected attribute. Asserted by test, not promised in a README.</text>
<rect x="24" y="676" width="940" height="56" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="38" y="697" font-size="11" fill="#64748B" font-weight="700" text-anchor="start">MEASURED, NOT CLAIMED</text>
<text x="38" y="715" font-size="10.5" fill="#64748B" font-weight="400" text-anchor="start">50× corpus growth → flat search latency (14.1 ms → 11.2 ms p50 at 500 candidates) · retrieval ablation on 16 graded queries · calibration (ECE / Brier) · $0.00 marginal cost, 100% local retrieval</text>
</svg>