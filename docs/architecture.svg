<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="Inter,-apple-system,Segoe UI,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#CBD5E1"/></marker></defs>
<rect width="1180" height="760" fill="#F8FAFC"/>
<text x="24" y="34" font-size="17" fill="#0F172A" font-weight="700" text-anchor="start">Millennium BD — Candidate Intelligence Platform</text>
<text x="24" y="54" font-size="11.5" fill="#64748B" font-weight="400" text-anchor="start">7 agents · 40 subagents · one AgentResult contract · every claim traceable to a source span</text>
<text x="24" y="80" font-size="10" fill="#64748B" font-weight="700" text-anchor="start">INGEST PIPELINE</text>
<rect x="24" y="86" width="200" height="108" rx="7" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.4"/>
<text x="35" y="106" font-size="12.5" font-weight="650" fill="#0F172A">1 · Ingestion</text>
<text x="35" y="123.0" font-size="10" fill="#64748B">6 subagents</text>
<text x="35" y="136.5" font-size="10" fill="#64748B">magic-byte typing</text>
<text x="35" y="150.0" font-size="10" fill="#64748B">column-order repair</text>
<text x="35" y="163.5" font-size="10" fill="#64748B">merged-cell dedup</text>
<text x="35" y="177.0" font-size="10" fill="#64748B">near-duplicate (Jaccard)</text>
<rect x="248" y="86" width="200" height="108" rx="7" fill="#FFFFFF" stroke="#B91C1C" stroke-width="1.4"/>
<text x="259" y="106" font-size="12.5" font-weight="650" fill="#0F172A">2 · Sanitize</text>
<text x="259" y="123.0" font-size="10" fill="#64748B">10 injection families</text>
<text x="259" y="136.5" font-size="10" fill="#64748B">render-layer scan</text>
<text x="259" y="150.0" font-size="10" fill="#64748B">white-on-white / 1pt</text>
<text x="259" y="163.5" font-size="10" fill="#64748B">neutralise + log</text>
<rect x="472" y="86" width="224" height="108" rx="7" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.4"/>
<text x="483" y="106" font-size="12.5" font-weight="650" fill="#0F172A">3 · Parsing (LLM API)</text>
<text x="483" y="123.0" font-size="10" fill="#64748B">8 subagents</text>
<text x="483" y="136.5" font-size="10" fill="#64748B">3 targeted passes</text>
<text x="483" y="150.0" font-size="10" fill="#64748B">no tools passed</text>
<text x="483" y="163.5" font-size="10" fill="#64748B">quote required per value</text>
<text x="483" y="177.0" font-size="10" fill="#64748B">4th pass only on conflict</text>
<rect x="720" y="86" width="200" height="108" rx="7" fill="#FFFFFF" stroke="#B45309" stroke-width="1.4"/>
<text x="731" y="106" font-size="12.5" font-weight="650" fill="#0F172A">4 · Ground or ABSTAIN</text>
<text x="731" y="123.0" font-size="10" fill="#64748B">exact → normalised → fuzzy</text>
<text x="731" y="136.5" font-size="10" fill="#64748B">quote not found ⇒</text>
<text x="731" y="150.0" font-size="10" fill="#64748B">value DISCARDED</text>
<text x="731" y="163.5" font-size="10" fill="#64748B">abstention is a success</text>
<rect x="944" y="86" width="200" height="108" rx="7" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1.4"/>
<text x="955" y="106" font-size="12.5" font-weight="650" fill="#0F172A">5 · Classify + Validate</text>
<text x="955" y="123.0" font-size="10" fill="#64748B">12 subagents</text>
<text x="955" y="136.5" font-size="10" fill="#64748B">closed taxonomies</text>
<text x="955" y="150.0" font-size="10" fill="#64748B">dates derived in Python</text>
<text x="955" y="163.5" font-size="10" fill="#64748B">contradictions, gaps</text>
<text x="955" y="177.0" font-size="10" fill="#64748B">review routing</text>
